name: Update README
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
jobs:
  build:
    name: Update this repo's README with recent activity
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - name: Update README with activity
        uses: athul/update-readme@v2
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          username: sebastian8068
          readme: README.md
          max_lines: 10
          commit_message: "Update recent activity"
          commit_name: GitHub Activity Readme
          commit_email: github-actions[bot]@users.noreply.github.com
